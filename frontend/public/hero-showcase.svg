<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" role="img" aria-label="SkillBridge marketplace — providers, customers, and operations">
  <title>SkillBridge marketplace showcase</title>
  <desc>Stylized illustration of a service marketplace connecting verified providers with customers, with operational signals like booking confirmations, payments, and ratings.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7fbff"/>
      <stop offset="1" stop-color="#deebf7"/>
    </linearGradient>

    <radialGradient id="accent-tr" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2171b5" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#2171b5" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="accent-bl" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#9ecae1" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#9ecae1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="hub-glow" cx="0.5" cy="0.5" r="0.6">
      <stop offset="0" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="0.55" stop-color="#deebf7" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#deebf7" stop-opacity="0"/>
    </radialGradient>

    <pattern id="dots" x="0" y="0" width="36" height="36" patternUnits="userSpaceOnUse">
      <circle cx="18" cy="18" r="1.4" fill="#9ecae1" fill-opacity="0.45"/>
    </pattern>

    <filter id="cardshadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#08306b" flood-opacity="0.10"/>
    </filter>
    <filter id="chipshadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#08306b" flood-opacity="0.09"/>
    </filter>

    <clipPath id="clip-maya"><circle cx="0" cy="0" r="44"/></clipPath>
    <clipPath id="clip-marcus"><circle cx="0" cy="0" r="44"/></clipPath>
    <clipPath id="clip-sarah"><circle cx="0" cy="0" r="44"/></clipPath>
  </defs>

  <!-- ============= LAYER 1: Background ============= -->
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#dots)"/>
  <ellipse cx="1320" cy="180" rx="560" ry="380" fill="url(#accent-tr)"/>
  <ellipse cx="280" cy="760" rx="540" ry="360" fill="url(#accent-bl)"/>

  <!-- ============= LAYER 2: Connection paths to hub ============= -->
  <g stroke="#9ecae1" stroke-width="1.5" stroke-dasharray="5 8" fill="none" opacity="0.75">
    <path d="M 360 240 Q 580 320 760 430"/>
    <path d="M 1280 250 Q 1080 350 840 430"/>
    <path d="M 1280 700 Q 1060 600 840 470"/>
    <path d="M 320 720 Q 540 600 760 470"/>
    <path d="M 220 470 Q 440 460 740 450"/>
    <path d="M 1380 470 Q 1160 460 860 450"/>
  </g>

  <!-- ============= LAYER 3: Central hub ============= -->
  <g transform="translate(800,450)">
    <circle r="220" fill="none" stroke="#9ecae1" stroke-width="1" stroke-dasharray="2 6" opacity="0.45"/>
    <circle r="170" fill="none" stroke="#9ecae1" stroke-width="1" stroke-dasharray="3 6" opacity="0.55"/>
    <circle r="130" fill="url(#hub-glow)"/>
    <circle r="86" fill="#ffffff" stroke="#c6dbef" stroke-width="1.5"/>
    <circle r="86" fill="none" stroke="#2171b5" stroke-width="0.5" opacity="0.4"/>

    <!-- Stylized bridge mark — arc with vertical struts -->
    <g stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M -42 12 Q 0 -34 42 12" stroke="#08306b" stroke-width="5"/>
      <line x1="-42" y1="12" x2="-42" y2="32" stroke="#08306b" stroke-width="5"/>
      <line x1="42" y1="12" x2="42" y2="32" stroke="#08306b" stroke-width="5"/>
      <line x1="-26" y1="20" x2="-26" y2="32" stroke="#2171b5" stroke-width="3.5"/>
      <line x1="0" y1="6" x2="0" y2="32" stroke="#2171b5" stroke-width="3.5"/>
      <line x1="26" y1="20" x2="26" y2="32" stroke="#2171b5" stroke-width="3.5"/>
    </g>
    <text y="68" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif"
          font-size="13" font-weight="700" fill="#08306b" letter-spacing="3.5">SKILLBRIDGE</text>
  </g>

  <!-- ============= LAYER 4: Provider Card 1 — Maya (Black woman, Cleaning) ============= -->
  <g transform="translate(160,140)" filter="url(#cardshadow)">
    <rect width="340" height="140" rx="22" fill="#ffffff"/>
    <rect width="340" height="140" rx="22" fill="none" stroke="#e6f0fa" stroke-width="1"/>

    <!-- Avatar -->
    <g transform="translate(78,70)">
      <circle r="48" fill="#deebf7"/>
      <g clip-path="url(#clip-maya)">
        <rect x="-46" y="-46" width="92" height="92" fill="#5a3320"/>
        <!-- shirt / shoulders -->
        <ellipse cx="0" cy="58" rx="54" ry="26" fill="#e89172"/>
        <path d="M -32 38 Q -16 30 0 32 Q 16 30 32 38 L 36 56 L -36 56 Z" fill="#e89172"/>
        <!-- neck -->
        <rect x="-9" y="14" width="18" height="22" fill="#5a3320"/>
        <!-- head -->
        <ellipse cx="0" cy="-2" rx="22" ry="24" fill="#5a3320"/>
        <!-- subtle chin shadow -->
        <ellipse cx="0" cy="14" rx="14" ry="6" fill="#3f2317" opacity="0.25"/>
        <!-- hair: voluminous halo of curls -->
        <path d="M -32 -10
                 Q -38 -32 -22 -36
                 Q -14 -42 -6 -38
                 Q 0 -42 6 -38
                 Q 14 -42 22 -36
                 Q 38 -32 32 -10
                 Q 36 -2 30 4
                 Q 28 -10 22 -12
                 Q 24 -22 16 -22
                 Q 10 -28 0 -26
                 Q -10 -28 -16 -22
                 Q -24 -22 -22 -12
                 Q -28 -10 -30 4
                 Q -36 -2 -32 -10 Z"
              fill="#150806"/>
        <!-- hair texture bumps -->
        <circle cx="-22" cy="-26" r="5" fill="#150806"/>
        <circle cx="-12" cy="-32" r="5" fill="#150806"/>
        <circle cx="0" cy="-34" r="5" fill="#150806"/>
        <circle cx="12" cy="-32" r="5" fill="#150806"/>
        <circle cx="22" cy="-26" r="5" fill="#150806"/>
        <circle cx="-28" cy="-14" r="4" fill="#150806"/>
        <circle cx="28" cy="-14" r="4" fill="#150806"/>
        <!-- earrings -->
        <circle cx="-21" cy="2" r="2" fill="#d4a045"/>
        <circle cx="21" cy="2" r="2" fill="#d4a045"/>
      </g>
    </g>

    <!-- name + role -->
    <text x="148" y="50" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="600" fill="#08306b">Maya Chen</text>
    <text x="148" y="72" font-family="system-ui, sans-serif" font-size="13" fill="#4292c6">Home cleaning · Tel Aviv</text>

    <!-- Verified badge -->
    <g transform="translate(148,90)">
      <rect width="80" height="22" rx="11" fill="#deebf7"/>
      <path d="M 12 11 L 16 15 L 23 7" stroke="#08519c" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="32" y="15" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#08519c">Verified</text>
    </g>
    <!-- Star rating -->
    <g transform="translate(238,89)">
      <path d="M 8 0 L 10 5 L 16 6 L 11.5 10 L 13 16 L 8 13 L 3 16 L 4.5 10 L 0 6 L 6 5 Z" fill="#f5b400"/>
      <text x="22" y="14" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#08306b">4.9</text>
      <text x="48" y="14" font-family="system-ui, sans-serif" font-size="11" fill="#6baed6">(218)</text>
    </g>
  </g>

  <!-- ============= LAYER 5: Provider Card 2 — Marcus (Black man, Plumbing) ============= -->
  <g transform="translate(1100,170)" filter="url(#cardshadow)">
    <rect width="340" height="140" rx="22" fill="#ffffff"/>
    <rect width="340" height="140" rx="22" fill="none" stroke="#e6f0fa" stroke-width="1"/>

    <g transform="translate(78,70)">
      <circle r="48" fill="#deebf7"/>
      <g clip-path="url(#clip-marcus)">
        <rect x="-46" y="-46" width="92" height="92" fill="#6b4128"/>
        <!-- workshirt — navy -->
        <ellipse cx="0" cy="58" rx="54" ry="26" fill="#2c5282"/>
        <path d="M -32 38 Q -16 30 0 32 Q 16 30 32 38 L 36 56 L -36 56 Z" fill="#2c5282"/>
        <!-- collar accent -->
        <path d="M -10 32 L 0 42 L 10 32" stroke="#1d3a5e" stroke-width="2" fill="none"/>
        <!-- neck -->
        <rect x="-9" y="14" width="18" height="22" fill="#6b4128"/>
        <!-- head -->
        <ellipse cx="0" cy="-2" rx="21" ry="24" fill="#6b4128"/>
        <!-- jaw shadow -->
        <ellipse cx="0" cy="14" rx="13" ry="5" fill="#4d2d1c" opacity="0.3"/>
        <!-- short fade hair -->
        <path d="M -20 -16
                 Q -22 -26 -12 -28
                 Q 0 -32 12 -28
                 Q 22 -26 20 -16
                 Q 18 -22 8 -22
                 Q 0 -24 -8 -22
                 Q -18 -22 -20 -16 Z"
              fill="#150806"/>
        <!-- subtle beard line -->
        <path d="M -16 6 Q -14 16 0 18 Q 14 16 16 6"
              stroke="#2a1812" stroke-width="2" fill="none" opacity="0.5" stroke-linecap="round"/>
      </g>
    </g>

    <text x="148" y="50" font-family="system-ui, sans-serif" font-size="18" font-weight="600" fill="#08306b">Marcus Davis</text>
    <text x="148" y="72" font-family="system-ui, sans-serif" font-size="13" fill="#4292c6">Plumbing · Available now</text>

    <!-- Top-rated badge -->
    <g transform="translate(148,90)">
      <rect width="92" height="22" rx="11" fill="#fff4d6"/>
      <path d="M 13 4 L 14.5 8 L 18.5 8.5 L 15.5 11 L 16.5 15 L 13 12.5 L 9.5 15 L 10.5 11 L 7.5 8.5 L 11.5 8 Z" fill="#d4a017"/>
      <text x="24" y="15" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#7a5800">Top rated</text>
    </g>
    <!-- 5.0 rating -->
    <g transform="translate(250,89)">
      <path d="M 8 0 L 10 5 L 16 6 L 11.5 10 L 13 16 L 8 13 L 3 16 L 4.5 10 L 0 6 L 6 5 Z" fill="#f5b400"/>
      <text x="22" y="14" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#08306b">5.0</text>
      <text x="48" y="14" font-family="system-ui, sans-serif" font-size="11" fill="#6baed6">(94)</text>
    </g>
  </g>

  <!-- ============= LAYER 6: Customer Card — Sarah (White woman) ============= -->
  <g transform="translate(1140,610)" filter="url(#cardshadow)">
    <rect width="340" height="140" rx="22" fill="#ffffff"/>
    <rect width="340" height="140" rx="22" fill="none" stroke="#e6f0fa" stroke-width="1"/>

    <g transform="translate(78,70)">
      <circle r="48" fill="#deebf7"/>
      <g clip-path="url(#clip-sarah)">
        <rect x="-46" y="-46" width="92" height="92" fill="#f1c8a3"/>
        <!-- back hair (long, behind shoulders) -->
        <path d="M -34 -8
                 Q -42 28 -34 56
                 L 34 56
                 Q 42 28 34 -8 Z"
              fill="#a86d35"/>
        <!-- shirt -->
        <ellipse cx="0" cy="58" rx="54" ry="26" fill="#7aa9d6"/>
        <path d="M -32 38 Q -16 30 0 32 Q 16 30 32 38 L 36 56 L -36 56 Z" fill="#7aa9d6"/>
        <!-- soft v-neck shadow -->
        <path d="M -8 32 L 0 40 L 8 32" stroke="#5b8aba" stroke-width="2" fill="none"/>
        <!-- neck -->
        <rect x="-9" y="14" width="18" height="22" fill="#f1c8a3"/>
        <!-- head -->
        <ellipse cx="0" cy="-2" rx="21" ry="24" fill="#f1c8a3"/>
        <!-- subtle blush -->
        <ellipse cx="-12" cy="6" rx="4" ry="2" fill="#f0a78c" opacity="0.5"/>
        <ellipse cx="12" cy="6" rx="4" ry="2" fill="#f0a78c" opacity="0.5"/>
        <!-- chin shadow -->
        <ellipse cx="0" cy="14" rx="12" ry="4" fill="#d9a47b" opacity="0.4"/>
        <!-- front hair: side-parted, falls over forehead and frames face -->
        <path d="M -22 -14
                 Q -24 -32 -8 -32
                 Q 0 -36 12 -32
                 Q 24 -28 24 -10
                 Q 22 -18 14 -20
                 Q 8 -22 -2 -18
                 Q -10 -14 -16 -16
                 Q -22 -14 -22 -2
                 Q -24 -10 -22 -14 Z"
              fill="#b8753a"/>
        <!-- side hair sweep -->
        <path d="M 22 -14 Q 28 6 22 22 Q 18 14 18 0 Z" fill="#a86d35"/>
        <path d="M -22 -10 Q -28 8 -22 22 Q -18 14 -18 0 Z" fill="#a86d35"/>
      </g>
    </g>

    <text x="148" y="50" font-family="system-ui, sans-serif" font-size="18" font-weight="600" fill="#08306b">Sarah Bennett</text>
    <text x="148" y="72" font-family="system-ui, sans-serif" font-size="13" fill="#4292c6">Customer · Just booked Maya</text>

    <!-- Booking confirmed mini badge -->
    <g transform="translate(148,90)">
      <rect width="100" height="22" rx="11" fill="#dcf2e2"/>
      <path d="M 12 11 L 16 15 L 23 7" stroke="#1f7a3a" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="32" y="15" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#1f7a3a">Confirmed</text>
    </g>
    <!-- Time chip -->
    <g transform="translate(258,89)">
      <text x="0" y="14" font-family="system-ui, sans-serif" font-size="11" fill="#6baed6">Tomorrow</text>
      <text x="0" y="28" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#08306b">10:00 AM</text>
    </g>
  </g>

  <!-- ============= LAYER 7: Operations chips ============= -->

  <!-- Booking confirmed pill — top center -->
  <g transform="translate(680,80)" filter="url(#chipshadow)">
    <rect width="240" height="56" rx="28" fill="#ffffff"/>
    <g transform="translate(28,28)">
      <circle r="16" fill="#dcf2e2"/>
      <path d="M -7 0 L -2 5 L 8 -6" stroke="#1f7a3a" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="56" y="26" font-family="system-ui, sans-serif" font-size="13" fill="#4292c6">Live now</text>
    <text x="56" y="44" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#08306b">Booking confirmed</text>
  </g>

  <!-- Payment secured pill — bottom left -->
  <g transform="translate(120,690)" filter="url(#chipshadow)">
    <rect width="240" height="56" rx="28" fill="#ffffff"/>
    <g transform="translate(28,28)">
      <circle r="16" fill="#deebf7"/>
      <path d="M 0 -8 L -8 -4 L -8 2 Q -8 8 0 10 Q 8 8 8 2 L 8 -4 Z"
            fill="#08519c"/>
      <path d="M -3 0 L -1 2 L 3 -2" stroke="#ffffff" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="56" y="26" font-family="system-ui, sans-serif" font-size="13" fill="#4292c6">Stripe escrow</text>
    <text x="56" y="44" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#08306b">Payment secured</text>
  </g>

  <!-- Activity / rating burst — mid-left small chip -->
  <g transform="translate(60,400)" filter="url(#chipshadow)">
    <rect width="170" height="76" rx="18" fill="#ffffff"/>
    <text x="20" y="32" font-family="system-ui, sans-serif" font-size="11" fill="#6baed6" letter-spacing="1.5">THIS WEEK</text>
    <text x="20" y="58" font-family="system-ui, sans-serif" font-size="22" font-weight="700" fill="#08306b">2,418</text>
    <text x="92" y="58" font-family="system-ui, sans-serif" font-size="12" fill="#4292c6">jobs</text>
    <!-- mini bar chart -->
    <g transform="translate(20,62)">
      <rect x="0" y="0" width="6" height="10" rx="1.5" fill="#9ecae1"/>
      <rect x="10" y="-4" width="6" height="14" rx="1.5" fill="#6baed6"/>
      <rect x="20" y="-2" width="6" height="12" rx="1.5" fill="#9ecae1"/>
      <rect x="30" y="-7" width="6" height="17" rx="1.5" fill="#2171b5"/>
      <rect x="40" y="-3" width="6" height="13" rx="1.5" fill="#6baed6"/>
    </g>
  </g>

  <!-- Chat bubble — mid right -->
  <g transform="translate(1370,450)" filter="url(#chipshadow)">
    <path d="M 0 16
             Q 0 0 16 0
             L 184 0
             Q 200 0 200 16
             L 200 60
             Q 200 76 184 76
             L 36 76
             L 22 92
             L 24 76
             Q 0 76 0 60 Z"
          fill="#ffffff"/>
    <text x="20" y="30" font-family="system-ui, sans-serif" font-size="11" fill="#6baed6" letter-spacing="1.2">MARCUS</text>
    <text x="20" y="54" font-family="system-ui, sans-serif" font-size="14" font-weight="500" fill="#08306b">On my way — ETA 18 min</text>
  </g>

  <!-- Verified shield — top right small badge -->
  <g transform="translate(1480,80)" filter="url(#chipshadow)">
    <rect width="80" height="80" rx="20" fill="#ffffff"/>
    <g transform="translate(40,40)">
      <path d="M 0 -22
               L 18 -14
               L 18 4
               Q 18 18 0 24
               Q -18 18 -18 4
               L -18 -14 Z"
            fill="#deebf7" stroke="#2171b5" stroke-width="2"/>
      <path d="M -8 0 L -2 6 L 10 -6" stroke="#08519c" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>

  <!-- Calendar tile — bottom center small -->
  <g transform="translate(720,720)" filter="url(#chipshadow)">
    <rect width="160" height="100" rx="18" fill="#ffffff"/>
    <rect x="14" y="14" width="132" height="20" rx="6" fill="#08519c"/>
    <text x="22" y="29" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#ffffff" letter-spacing="1.2">SCHEDULED</text>
    <text x="80" y="62" text-anchor="middle" font-family="system-ui, sans-serif" font-size="26" font-weight="700" fill="#08306b">26</text>
    <text x="80" y="82" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#4292c6">Apr · 10:00 AM</text>
  </g>

  <!-- Subtle decorative dots near hub -->
  <g fill="#2171b5" opacity="0.5">
    <circle cx="600" cy="450" r="3"/>
    <circle cx="1000" cy="450" r="3"/>
    <circle cx="800" cy="280" r="3"/>
    <circle cx="800" cy="620" r="3"/>
  </g>
</svg>
