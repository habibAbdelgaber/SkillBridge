name: Backend CI/CD

on:
  pull_request:
    branches: [main, develop]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
      - ".github/scripts/**"
  push:
    branches: [main, develop]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
      - ".github/scripts/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: backend

jobs:
  development:
    name: Development settings / SQLite
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DJANGO_SETTINGS_MODULE: config.settings.dev
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11.10"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip check
      - name: Validate development configuration and migrations
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run
      - name: Run backend tests
        run: python manage.py test apps --verbosity 2
      - name: Validate deployment gate
        working-directory: .
        run: python -m unittest discover -s .github/scripts -p 'test_*.py'

  production:
    name: Production settings / PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: skillbridge_ci
          POSTGRES_USER: skillbridge_ci
          POSTGRES_PASSWORD: skillbridge_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U skillbridge_ci -d skillbridge_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      SECRET_KEY: ci-only-secret-key-0123456789abcdefghijklmnopqrstuvwxyz
      DATABASE_URL: postgresql://skillbridge_ci:skillbridge_ci@localhost:5432/skillbridge_ci?sslmode=disable
      DB_CONN_MAX_AGE: "0"
      DB_SSL_REQUIRE: "false"
      ALLOWED_HOSTS: backend.example.test
      CORS_ALLOWED_ORIGINS: https://frontend.example.test
      FRONTEND_URL: https://frontend.example.test
      ACCOUNT_EMAIL_VERIFICATION: optional
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11.10"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip check
      - name: Validate production security and schema
        run: |
          python manage.py check --deploy --fail-level WARNING
          python manage.py makemigrations --check --dry-run
          python manage.py migrate --noinput
          python manage.py collectstatic --noinput
      - name: Run backend tests against PostgreSQL
        # API tests make HTTP requests; disable only the HTTPS redirect in this test step.
        env:
          SECURE_SSL_REDIRECT: "false"
        run: python manage.py test apps --verbosity 2

  # Deployment is inert until these repository variables are set to "true".
  # Configure backend-only DigitalOcean apps and protected GitHub environments first.
  deploy-development:
    name: Deploy development backend
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop' && vars.ENABLE_BACKEND_DEV_DEPLOY == 'true'
    needs: [development, production]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: development
    concurrency:
      group: backend-deploy-development
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Deploy verified backend commit
        working-directory: .
        env:
          DO_API_TOKEN: ${{ secrets.DO_API_TOKEN }}
          DO_APP_ID: ${{ vars.DO_BACKEND_APP_ID }}
          DO_SERVICE_NAME: ${{ vars.DO_BACKEND_SERVICE_NAME }}
        run: python .github/scripts/deploy_backend.py

  deploy-production:
    name: Deploy production backend
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.ENABLE_BACKEND_PROD_DEPLOY == 'true'
    needs: [development, production]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: production
    concurrency:
      group: backend-deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Deploy verified backend commit
        working-directory: .
        env:
          DO_API_TOKEN: ${{ secrets.DO_API_TOKEN }}
          DO_APP_ID: ${{ vars.DO_BACKEND_APP_ID }}
          DO_SERVICE_NAME: ${{ vars.DO_BACKEND_SERVICE_NAME }}
        run: python .github/scripts/deploy_backend.py
